name: Create release package

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Determine release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content 'src/Footprint/Footprint.csproj' -Raw)).Project.PropertyGroup.Version
          if ($version -notmatch '^[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Missing stable application version' }
          $tag = "v$version"
          $mainPush = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -eq 'refs/heads/main'
          if ($env:GITHUB_REF.StartsWith('refs/tags/') -and $env:GITHUB_REF -ne "refs/tags/$tag") {
            throw 'Release tag does not match application version'
          }
          $build = 'true'
          if ($mainPush) {
            try {
              Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' } | Out-Null
              $build = 'false'
            } catch {
              if ([int]$_.Exception.Response.StatusCode -ne 404) { throw }
            }
          }
          $notes = "docs/releases/$tag.md"
          if (-not (Test-Path -LiteralPath $notes)) { $notes = '' }
          $publish = ($mainPush -or $env:GITHUB_REF.StartsWith('refs/tags/')).ToString().ToLowerInvariant()
          "tag=$tag", "build=$build", "publish=$publish", "notes=$notes" | Add-Content -Path $env:GITHUB_OUTPUT -Encoding utf8
      - uses: actions/setup-dotnet@v4
        if: steps.release.outputs.build == 'true'
        with:
          dotnet-version: '8.0.x'
      - name: Verify release build and smoke tests
        if: steps.release.outputs.build == 'true'
        shell: pwsh
        run: |
          dotnet build Footprint.sln --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Footprint.Core.SmokeTests --configuration Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/Footprint.Ui.SmokeTests --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish self-contained Windows application
        if: steps.release.outputs.build == 'true'
        run: >
          dotnet publish src/Footprint/Footprint.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/publish/Footprint
      - name: Create ZIP package
        if: steps.release.outputs.build == 'true'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/Footprint/*" -DestinationPath "artifacts/Footprint-win-x64.zip"
      - name: Upload release package
        if: steps.release.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Footprint-win-x64
          path: artifacts/Footprint-win-x64.zip
          if-no-files-found: error
      - name: Create GitHub Release
        if: steps.release.outputs.build == 'true' && steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Footprint ${{ steps.release.outputs.tag }}
          body_path: ${{ steps.release.outputs.notes }}
          files: artifacts/Footprint-win-x64.zip
