name: Implement Issue and build
run-name: 'Issue #${{ inputs.issue_number }} implementation and build'
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open Issue number in this repository'
        required: true
        type: string
      check_setup_only:
        description: 'Check configuration without calling OpenAI or creating changes'
        type: boolean
        default: false
permissions:
  contents: read
  issues: read
concurrency:
  group: implement-issue-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      base: ${{ steps.prepare.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Prepare request
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CHECK_SETUP_ONLY: ${{ inputs.check_setup_only }}
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          test -n "$OPENAI_KEY" || { echo '::error::Configure repository secret OPENAI_API_KEY before requesting implementation.'; exit 1; }
          if [ "$CHECK_SETUP_ONLY" = "true" ]; then echo "Configuration check passed; no implementation requested."; exit 0; fi
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]{0,8}$ ]] || { echo '::error::Invalid Issue number'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER" > "$RUNNER_TEMP/request.json"
          python3 .github/scripts/prepare-issue.py "$RUNNER_TEMP/request.json" "$RUNNER_TEMP/prompt.txt"
          echo "base=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Implement with Codex
        if: ${{ !inputs.check_setup_only }}
        uses: openai/codex-action@86365089eb2b84e0a8fb0717b304f8bdcb13b20e
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/prompt.txt
          permission-profile: ':workspace'
      - name: Collect implementation
        if: ${{ !inputs.check_setup_only }}
        run: |
          git add -N .
          if git diff --quiet; then echo '::error::No implementation changes were produced.'; exit 1; fi
          if ! git diff --quiet -- .github; then echo '::error::Workflow changes require a separate reviewed request.'; exit 1; fi
          git diff --binary > "$RUNNER_TEMP/implementation.patch"
      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.check_setup_only }}
        with:
          name: implementation-patch
          path: ${{ runner.temp }}/implementation.patch
          if-no-files-found: error
          retention-days: 7
  build:
    if: ${{ !inputs.check_setup_only }}
    needs: implement
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.implement.outputs.base }}
      - uses: actions/download-artifact@v4
        with:
          name: implementation-patch
          path: ${{ runner.temp }}/patch
      - name: Apply implementation
        run: git apply --index "${{ runner.temp }}/patch/implementation.patch"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build Footprint.sln --configuration Release
      - run: dotnet run --project tests/Footprint.Core.SmokeTests --configuration Release --no-build
      - run: dotnet run --project tests/Footprint.Ui.SmokeTests --configuration Release
      - name: Publish Windows ZIP
        shell: pwsh
        run: |
          dotnet publish src/Footprint/Footprint.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output "$env:RUNNER_TEMP/publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path "$env:RUNNER_TEMP/publish/*" -DestinationPath "$env:RUNNER_TEMP/Footprint-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Footprint-Issue-${{ inputs.issue_number }}-win-x64
          path: ${{ runner.temp }}/Footprint-win-x64.zip
          if-no-files-found: error
          retention-days: 30
      - name: Create implementation PR
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: pwsh
        run: |
          $branch = "codex/issue-$env:ISSUE_NUMBER-$env:GITHUB_RUN_ID"
          git switch -c $branch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Implement Issue #$env:ISSUE_NUMBER"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin $branch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = "Closes #$env:ISSUE_NUMBER`n`nWindows build, core smoke tests and UI smoke tests passed. Trial ZIP: $runUrl (Artifacts, 30 days).`n`nReview before merging into develop. Release from main after all release Issues are complete."
          Set-Content -Path "$env:RUNNER_TEMP/pr.md" -Value $body -Encoding utf8
          $pr = gh pr create --base develop --head $branch --title "Implement Issue #$env:ISSUE_NUMBER" --body-file "$env:RUNNER_TEMP/pr.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Set-Content -Path "$env:RUNNER_TEMP/comment.md" -Value "Implementation PR: $pr`nBuild and downloadable trial ZIP: $runUrl`nFormal release is available after review, merge and release." -Encoding utf8
          gh issue comment $env:ISSUE_NUMBER --body-file "$env:RUNNER_TEMP/comment.md"
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        shell: pwsh
        run: |
          if ($env:ISSUE_NUMBER -match '^[1-9][0-9]{0,8}$') {
            "Implementation build failed. See https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID . No formal release was published." | Set-Content "$env:RUNNER_TEMP/failure.md"
            gh issue comment $env:ISSUE_NUMBER --body-file "$env:RUNNER_TEMP/failure.md"
          }
