name: 不具合
description: 再現手順と期待する動作を報告
title: "[不具合] "
body:
  - type: input
    id: version
    attributes:
      label: バージョン
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作と実際の動作
    validations:
      required: true
